apiVersion: v1
kind: Secret
metadata:
  name: transcendence-secrets
  # 1. This guarantees it follows your Helm --namespace flag
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
# 2. This loops through your decrypted SOPS file perfectly
{{- range $key, $val := .Values.secrets }}
  {{ $key }}: {{ $val | quote }}
{{- end }}
