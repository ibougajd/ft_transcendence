apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: ibougajd/nginx:v2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 443
        volumeMounts:
          # Mount the SSL Certificates
          - name: certs
            mountPath: "/etc/nginx/certs"
            readOnly: true
      volumes:
      - name: certs
        secret:
          # Kustomize will automatically find the hashed name
          secretName: nginx-certs
